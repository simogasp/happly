name: macOS

on:
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
    
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: configure
      run: cd test && mkdir build && cd build && cmake -DCMAKE_BUILD_TYPE=Debug ..

    - name: build
      run: cd test/build && cmake --build "." -v

    - name: run test
      run: cd test/build && ./bin/ply-test
